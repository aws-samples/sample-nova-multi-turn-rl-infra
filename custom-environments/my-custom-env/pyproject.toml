[project]
name = "my-custom-env"
description = "Custom RL Environment"
version = "0.1.0"
requires-python = ">=3.11"
# `verifiers` is provided by the Nova Forge starter kit.
dependencies = [
    "datasets>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_custom_env"]

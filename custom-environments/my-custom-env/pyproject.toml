[project]
name = "my-custom-env"
description = "Custom RL Environment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.0.0",
    "amzn-agi-verifiers>=1.0.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_custom_env"]
